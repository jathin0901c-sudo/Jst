<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" fill="none">
  <!-- Background -->
  <rect width="500" height="500" fill="#ffffff" />

  <defs>
    <!-- Gold Gradient for realistic metallic sheen -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cfad68" />
      <stop offset="35%" stop-color="#b68d44" />
      <stop offset="70%" stop-color="#dfc688" />
      <stop offset="100%" stop-color="#a87f38" />
    </linearGradient>
    <linearGradient id="navyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b1325" />
      <stop offset="100%" stop-color="#141e33" />
    </linearGradient>
  </defs>

  <!-- Outer Geometric Gold Rings & Intersecting Bezel Facets -->
  <g stroke="url(#goldGradient)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Primary Outer Circle -->
    <circle cx="250" cy="275" r="195" stroke-width="3" />
    <!-- Secondary Inner Concentric Ring -->
    <circle cx="250" cy="275" r="183" stroke-width="1.75" opacity="0.95" />
    <!-- Additional Delicate Concentric Ring -->
    <circle cx="250" cy="275" r="201" stroke-width="0.8" opacity="0.6" />

    <!-- Geometric Intersecting Wireframe Arcs around the circle (12-point luxury watch/insignia facets) -->
    <path d="M 55,275 C 95,140 180,85 250,80" stroke-width="1.2" opacity="0.85" />
    <path d="M 445,275 C 405,140 320,85 250,80" stroke-width="1.2" opacity="0.85" />
    <path d="M 55,275 C 95,410 180,465 250,470" stroke-width="1.2" opacity="0.85" />
    <path d="M 445,275 C 405,410 320,465 250,470" stroke-width="1.2" opacity="0.85" />
    
    <path d="M 112,137 C 200,95 300,95 388,137" stroke-width="1" opacity="0.75" />
    <path d="M 112,413 C 200,455 300,455 388,413" stroke-width="1" opacity="0.75" />
    <path d="M 67,200 C 130,120 370,120 433,200" stroke-width="0.8" opacity="0.6" />
    <path d="M 67,350 C 130,430 370,430 433,350" stroke-width="0.8" opacity="0.6" />

    <path d="M 80,210 L 150,110 M 420,210 L 350,110" stroke-width="0.8" opacity="0.6" />
    <path d="M 80,340 L 150,440 M 420,340 L 350,440" stroke-width="0.8" opacity="0.6" />
  </g>

  <!-- Coat Hanger (Gold) -->
  <g stroke="url(#goldGradient)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Hook -->
    <path d="M 250,140 L 250,120 C 250,90 278,80 275,60 C 272,40 248,38 238,52 C 230,62 237,70 242,70" stroke-width="4.2" />
    <!-- Top hanger neck pedestal -->
    <path d="M 238,140 L 262,140 L 256,155 L 244,155 Z" fill="url(#goldGradient)" stroke-width="1" />
    <!-- Sloping wooden/metal hanger shoulders -->
    <path d="M 250,155 L 225,188 L 175,200" stroke-width="3.5" />
    <path d="M 250,155 L 275,188 L 325,200" stroke-width="3.5" />
    <path d="M 175,200 Q 250,195 325,200" stroke-width="2.5" opacity="0.7" />
  </g>

  <!-- Midnight Navy Blazer Jacket Contours & Silhouette -->
  <g stroke="url(#navyGradient)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer Left Shoulder & Sleeve -->
    <path d="M 225,180 L 172,210 C 160,218 152,238 148,270 L 132,360 C 130,372 128,395 125,410" stroke-width="4.5" />
    <!-- Outer Right Shoulder & Sleeve -->
    <path d="M 275,180 L 328,210 C 340,218 348,238 352,270 L 368,360 C 370,372 372,395 375,410" stroke-width="4.5" />
    
    <!-- Sleeve Inner Inseam Lines -->
    <path d="M 160,335 C 162,370 165,405 168,435" stroke-width="2" opacity="0.4" />
    <path d="M 340,335 C 338,370 335,405 332,435" stroke-width="2" opacity="0.4" />

    <!-- Jacket Hem Bottom Boundary Curve -->
    <path d="M 168,435 C 205,455 295,455 332,435" stroke-width="3" />
  </g>

  <!-- Tailored Notched Lapels & Jacket Structure (Gold Accent Trim) -->
  <g stroke="url(#goldGradient)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left Collar & Lapel -->
    <!-- Collar top line -->
    <path d="M 225,180 L 202,235 L 213,240" stroke-width="3.2" />
    <!-- Lapel body tapering down to waist button gorge -->
    <path d="M 213,240 L 178,252 L 236,390" stroke-width="3.5" />
    <!-- Inner lapel facet line for bespoke tailored appearance -->
    <path d="M 200,240 L 228,370" stroke-width="1.8" opacity="0.8" />

    <!-- Right Collar & Lapel -->
    <!-- Collar top line -->
    <path d="M 275,180 L 298,235 L 287,240" stroke-width="3.2" />
    <!-- Lapel body tapering down to waist button gorge -->
    <path d="M 287,240 L 322,252 L 264,390" stroke-width="3.5" />
    <!-- Inner lapel facet line -->
    <path d="M 300,240 L 272,370" stroke-width="1.8" opacity="0.8" />

    <!-- Chest Welt Pocket on Right Breast -->
    <path d="M 308,288 L 328,286" stroke-width="2.5" />
    <path d="M 310,298 L 326,296" stroke-width="1.5" opacity="0.75" />

    <!-- Lower Flap Pockets -->
    <path d="M 168,408 C 178,406 200,408 206,420 L 168,435 Z" stroke-width="2.2" fill="none" />
    <path d="M 332,408 C 322,406 300,408 294,420 L 332,435 Z" stroke-width="2.2" fill="none" />

    <!-- Center Seam & Buttons -->
    <path d="M 250,390 L 250,465" stroke-width="2.5" />
    <!-- Two Regal Buttons -->
    <circle cx="250" cy="406" r="4" stroke-width="2" fill="#ffffff" />
    <circle cx="250" cy="445" r="3.5" stroke-width="2" fill="#ffffff" />
  </g>

  <!-- Center Interlocking "BB" Monogram (Royal Gold Cipher) -->
  <g fill="url(#goldGradient)" stroke="url(#goldGradient)" stroke-linejoin="round">
    <!-- Left Inverted 'B' -->
    <g transform="translate(0, 0)">
      <!-- Left Stem -->
      <path d="M 238,245 L 238,298 L 243,298 L 243,245 Z" stroke-width="0.5" />
      <!-- Left Serifs -->
      <path d="M 234,245 L 245,245 M 234,298 L 245,298" stroke-width="2" stroke-linecap="square" />
      <!-- Left Upper Lobe (curves to left) -->
      <path d="M 238,246 C 215,246 215,270 238,270" stroke-width="3" fill="none" stroke-linecap="round" />
      <!-- Left Lower Lobe (curves to left) -->
      <path d="M 238,270 C 213,270 213,297 238,297" stroke-width="3.2" fill="none" stroke-linecap="round" />
      <!-- Left Inner Bowl Cutouts -->
      <path d="M 236,252 C 224,252 224,264 236,264" stroke-width="1" fill="none" opacity="0.6" />
      <path d="M 236,276 C 223,276 223,291 236,291" stroke-width="1" fill="none" opacity="0.6" />
    </g>

    <!-- Center Interlocking Knot / Flourish Ties -->
    <path d="M 232,270 C 243,264 257,264 268,270 C 257,276 243,276 232,270 Z" fill="url(#goldGradient)" />

    <!-- Right Standard 'B' -->
    <g transform="translate(0, 0)">
      <!-- Right Stem -->
      <path d="M 262,245 L 262,298 L 257,298 L 257,245 Z" stroke-width="0.5" />
      <!-- Right Serifs -->
      <path d="M 255,245 L 266,245 M 255,298 L 266,298" stroke-width="2" stroke-linecap="square" />
      <!-- Right Upper Lobe (curves to right) -->
      <path d="M 262,246 C 285,246 285,270 262,270" stroke-width="3" fill="none" stroke-linecap="round" />
      <!-- Right Lower Lobe (curves to right) -->
      <path d="M 262,270 C 287,270 287,297 262,297" stroke-width="3.2" fill="none" stroke-linecap="round" />
      <!-- Right Inner Bowl Cutouts -->
      <path d="M 264,252 C 276,252 276,264 264,264" stroke-width="1" fill="none" opacity="0.6" />
      <path d="M 264,276 C 277,276 277,291 264,291" stroke-width="1" fill="none" opacity="0.6" />
    </g>
  </g>
</svg>
